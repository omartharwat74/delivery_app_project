name: delivery_app_project
description: "Driver delivery app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.0.3
  go_router: ^15.1.2
  http: ^1.2.1
  shared_preferences: ^2.3.2
  dartz: ^0.10.1
  connectivity_plus: ^6.0.5
  flutter_svg: ^2.0.17
  pin_code_fields: ^8.0.1
  image_picker: ^1.1.2
  dio: ^5.10.0
  flutter_secure_storage: ^10.3.1
  pretty_dio_logger: ^1.4.0
  jwt_decoder: ^2.0.1
  dotted_border: ^3.1.0

  intl: any
  cached_network_image: ^4.0.3
  firebase_core: ^3.15.2
  firebase_database: ^11.3.10
  geolocator: ^14.1.1
  firebase_messaging: ^15.2.10
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/mock_license.png
    - assets/images/image-upload.png
    - assets/images/user_avatar.png
    - assets/images/profile_avatar.png
    - assets/images/orders/
    - assets/images/orders/2.0x/
    - assets/images/orders/3.0x/
    - assets/images/icons/orders/
    - assets/icons/
    - assets/icons/wallet/
    - assets/icons/orders/
    - assets/images/support/
    - assets/images/icons/support/
    - assets/images/image-add-01.png
    - assets/images/icons/general_settings/
    - assets/images/icons/profile/
    - assets/images/notifications/
    - assets/images/notifications/2.0x/
    - assets/images/notifications/3.0x/

  fonts:
    - family: ExpoArabic
      fonts:
        - asset: assets/fonts/ExpoArabic-Book.ttf
          weight: 400
        - asset: assets/fonts/ExpoArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ExpoArabic-SemiBold.ttf
          weight: 600
